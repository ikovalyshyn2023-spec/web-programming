<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Акустична варта — Лаб 6</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Акустична варта</h1>
    <p>Лабораторна 6 · Відображення та фільтрація сенсорів у DOM</p>
  </header>

  <main class="container">
    <section class="active-sensors">
      <h2>Активні сенсори</h2>
      <p class="hint">Секція показує активні сенсори та дає змогу відфільтрувати їх за районом і статусом.</p>

      <div class="sensor-filters">
        <label>
          Район
          <select id="district-filter">
            <option value="all">Усі райони</option>
            <option value="Галицький">Галицький</option>
            <option value="Франківський">Франківський</option>
            <option value="Шевченківський">Шевченківський</option>
            <option value="Сихівський">Сихівський</option>
            <option value="Личаківський">Личаківський</option>
            <option value="Залізничний">Залізничний</option>
          </select>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="critical-filter" />
          Тільки критичні
        </label>

        <p class="filters-note">Фільтри застосовуються автоматично після зміни значення.</p>
      </div>

      <div class="sensor-list"></div>
    </section>
  </main>

  <footer>WEB-програмування · Лабораторна 6</footer>
  <script src="./js/app.js"></script>
</body>
</html>
