<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Акустична варта — Лаб 5</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Акустична варта</h1>
    <p>Моніторинг міського шуму · система класів JavaScript (Лаб 5)</p>
  </header>

  <main class="container">
    <section class="stats" aria-label="Статистика">
      <div class="stat-card">
        <div class="label">Датчиків</div>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Середній рівень</div>
        <div class="value" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Критичних</div>
        <div class="value" id="stat-critical">0</div>
      </div>
    </section>

    <div class="toolbar">
      <input type="search" id="search-id" placeholder="Пошук за ID…" />
      <select id="filter-district"></select>
      <select id="filter-status">
        <option value="">Усі статуси</option>
        <option value="normal">normal</option>
        <option value="warning">warning</option>
        <option value="critical">critical</option>
      </select>
      <button type="button" class="secondary" id="btn-reset-filters">Скинути</button>
    </div>

    <section class="sensors-grid" id="sensors-grid" aria-label="Список датчиків"></section>
  </main>

  <footer>WEB-програмування · Лабораторна 5 · Проєктування системи класів</footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
